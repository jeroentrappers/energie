# cargo-deny: dependency licences and advisories, run in CI.

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Timing leaks in crypto-bigint 0.5 when handling secret integers. energie only verifies provider signatures with public keys through jsonwebtoken; private-key operations happen in tests only. The fix needs jsonwebtoken to move to crypto-bigint 0.7." },
    { id = "RUSTSEC-2023-0071", reason = "Timing attack on RSA private-key operations. energie only encrypts a password with the server's public key; private keys appear only in tests." },
]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
