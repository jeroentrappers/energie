# energie — example configuration.
# Copy to /etc/energie/energie.toml and adjust. Check it with:
#   energie --check-config /etc/energie/energie.toml

# shadow   : read everything from HA, decide, never actuate, compare with HA.
# control  : actuate through the selected actuators.
# simulate : closed loop against the built-in house model, on a virtual clock.
mode = "shadow"

# The dashboard and API. A listen address other machines can reach requires web_password_file
# or an [oidc] section (docs/CONFIGURATION.md).
listen = "127.0.0.1:8080"
# web_password_file = "/run/credentials/energie.service/web-password"

# Settings and Memory live here as JSON (written atomically, at most once a minute plus
# immediately on a settings change). systemd's StateDirectory=energie provides it.
state_dir = "/var/lib/energie"

# Tick period in ms (the engine runs once per tick).
tick_ms = 1000

# Persist Settings/Memory at most this often (seconds).
persist_interval_s = 60

# Who owns Settings and Memory: "ha" (the default in shadow mode: HA's helpers are adopted
# every tick, the dashboard controls are read only) or "local" (the default otherwise: the
# state dir, changed from the dashboard, the API and MQTT). Standalone, without HA:
# deploy/energie.standalone.example.toml.
# settings_source = "ha"

# Your location, for the sun position and the solar forecast.
[site]
latitude = 50.85
longitude = 4.35

[ha]
# http:// or ws:// (no TLS); /api/websocket is added when missing.
url = "http://192.168.1.10:8123"
# A file that holds only the long-lived access token. Keep it 0600, owned by root; systemd
# hands it to the service with LoadCredential (see energie.service).
token_file = "/run/credentials/energie.service/ha-token"
# Seed Settings and Memory from the HA helpers on first start (empty state dir).
seed = true
# How long to wait for HA's first snapshot at start.
start_wait_s = 30

# The devices: one [[device]] table per instance. `kind` is the driver (see docs/PLUGINS.md
# for the list and how to add one), `role` the slot(s) of the control logic it fills:
#   grid_meter  battery_inverter  pv (several are summed)  charger:buzz  charger:ev3
#   car:buzz  car:ev3  load:airco  load:vriezer  price_feed  solar_forecast  capacity_peak
# A bare role is enough when the kind fills one slot of it (role = "charger" for a SmartEVSE).
# `control` lists the slots whose commands the device carries out; it needs read_only = false
# (the default is true) and is ignored in shadow mode, which never actuates.
# A slot no device reads comes from Home Assistant (the house model in simulate mode); a
# device whose commands no one carries out gets the log actuator (the model in simulate mode).
#
# Common keys: id (a-z0-9_, also the entity group: <id>_<key>), kind, role, control,
# read_only, poll_ms (default per kind), grace_polls (3: failed polls that keep the last
# reading before it goes unavailable), name. Everything else belongs to the kind.
# Secrets are files (systemd LoadCredential), never inline. Addresses are IPs ("ip" or "ip:port").

# Home Assistant for every slot no other device reads. In control mode, add
# control = "*" and read_only = false to carry out the remaining commands as HA service calls.
[[device]]
id = "ha"
kind = "ha"
role = "*"

