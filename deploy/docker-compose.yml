# Run from the repository root: docker compose -f deploy/docker-compose.yml up -d
# Put energie.toml and any secrets files in deploy/config/, readable by uid 65532.
services:
  energie:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        ENERGIE_VERSION: v0.1.0
    image: energie:v0.1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/etc/energie:ro
      - energie-state:/var/lib/energie
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  energie-state:
