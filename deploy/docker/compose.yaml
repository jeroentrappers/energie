# energie with Docker Compose. Quick start: deploy/docker/README.md
services:
  energie:
    image: ghcr.io/jeroentrappers/energie:${ENERGIE_TAG:-latest}
    # To use your own build instead: docker compose up -d --build
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/etc/energie:ro
      # Your settings and history. Keep this volume when upgrading.
      - energie-state:/var/lib/energie
    secrets:
      - web-password
      # One line per secret your config refers to, and an entry at the bottom:
      # - mqtt-password
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

secrets:
  web-password:
    file: ./secrets/web-password
  # mqtt-password:
  #   file: ./secrets/mqtt-password

volumes:
  energie-state:
