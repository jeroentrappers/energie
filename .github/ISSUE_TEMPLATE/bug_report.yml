name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please remove addresses, serial numbers, tokens and other personal details from anything
        you paste. To report a security problem, use private reporting: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `energie --version`
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [simulate, shadow, control with dry_run, control]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and install method
      placeholder: Raspberry Pi 4, static binary with systemd
  - type: input
    id: hardware
    attributes:
      label: Devices involved
      placeholder: Solis S6-EH1P via Waveshare gateway
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `journalctl -u energie`, or entries from the audit log
      render: text
